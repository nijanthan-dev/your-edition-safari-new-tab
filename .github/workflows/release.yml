name: Release

# Each push to main tags the next version and publishes a GitHub release with:
# - Your-Edition-<version>-mac.zip                the signed, notarized Mac app (only
#                                                when the signing secrets are set)
# - your-edition-safari-extension-<version>.zip  the Safari bundle (build the app yourself)
# - your-edition-chrome-<version>.zip            the Chrome extension
# - SHA256SUMS.txt
#
# Next version: the patch after the latest vX.Y.Z tag. To jump to a new minor or
# major version, raise "version" in apps/extension/package.json above the latest tag.
# Pushes that change only Markdown or docs/ do not release.
#
# Signing secrets live in the "release" environment (Settings > Environments).
# Only the mac-app job can read them, and only on a push to main or a manual run;
# workflows from fork pull requests never get them. See README > Releases.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two pushes never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
      - name: Pick the next version
        id: version
        run: |
          base=$(node -p "require('./apps/extension/package.json').version")
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            version="$base"
          else
            IFS=. read -r major minor patch <<< "$latest"
            version="$major.$minor.$((patch + 1))"
            # A package.json version above the latest tag wins (manual minor/major bump).
            if [ "$(printf '%s\n' "$version" "$base" | sort -V | tail -1)" = "$base" ] && [ "$base" != "$latest" ]; then
              version="$base"
            fi
          fi
          echo "Releasing v$version (latest tag: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"


  # Builds, signs and notarizes the Mac app with the same script as
  # `pnpm install:safari`. It uses only GitHub's own actions and Apple's tools,
  # because this job holds the Developer ID certificate.
  mac-app:
    needs: version
    runs-on: macos-latest
    environment: release
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check for signing secrets
        id: check
        env:
          HAS_SECRETS: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.ASC_API_KEY_P8_BASE64 != '' }}
        run: |
          echo "signed=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          [ "$HAS_SECRETS" = true ] || echo "No signing secrets: this release has no Mac app."

      - uses: actions/checkout@v4
        if: steps.check.outputs.signed == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.signed == 'true'
        with:
          node-version: 20

      - name: Use the newest Xcode
        if: steps.check.outputs.signed == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "$major" -lt 27 ]; then
            echo "::error::The project needs Xcode 27 or later. This runner has Xcode $major."
            exit 1
          fi

      - name: Put the certificate and API key in a temporary keychain
        if: steps.check.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          umask 077
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize
        if: steps.check.outputs.signed == 'true'
        env:
          YOUR_EDITION_OUTPUT: ${{ runner.temp }}/app
          YOUR_EDITION_VERSION: ${{ needs.version.outputs.version }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          npx pnpm@10.11.1 install --frozen-lockfile
          sh scripts/install-safari.sh
          mkdir -p dist
          ditto -c -k --keepParent "$YOUR_EDITION_OUTPUT/Your Edition.app" "dist/Your-Edition-$VERSION-mac.zip"

      - name: Remove the keychain and API key
        if: always() && steps.check.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.signed == 'true'
        with:
          name: mac-app
          path: dist/*.zip
          retention-days: 1

  release:
    needs: [version, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The extension manifest takes its version from this package.json.
      - name: Stamp version
        working-directory: apps/extension
        run: npm pkg set version=$VERSION

      - name: Build bundles
        run: |
          pnpm build
          pnpm build:safari

      - uses: actions/download-artifact@v4
        if: needs.mac-app.outputs.signed == 'true'
        with:
          name: mac-app
          path: dist

      - name: Package
        run: |
          mkdir -p dist
          (cd apps/extension/.output/safari-mv3 && zip -qr "$GITHUB_WORKSPACE/dist/your-edition-safari-extension-$VERSION.zip" .)
          (cd apps/extension/.output/chrome-mv3 && zip -qr "$GITHUB_WORKSPACE/dist/your-edition-chrome-$VERSION.zip" .)
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Your Edition $TAG" \
            --generate-notes
